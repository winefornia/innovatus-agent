name: Square Sync

# Interim scheduler. Production maintenance runs inside Fly so Square/Supabase
# keys remain in the app's secret store. See docs/reliability-upgrade.md for the
# independent scheduler and freshness-monitor cutover (GitHub can auto-disable).
on:
  schedule:
    - cron: "17 9 * * 0"
  workflow_dispatch:
    inputs:
      operation:
        description: "Maintenance operation (database repair is manual only)"
        type: choice
        options: [sync, audit-security, secure-database]
        default: sync
      full:
        description: "Full Square backfill using idempotent upserts"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: square-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Maintain Square sync and database security
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      OPERATION: ${{ inputs.operation || 'sync' }}
      FULL: ${{ inputs.full || 'false' }}
    steps:
      - name: Check Fly credential
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::Missing FLY_API_TOKEN. Configure app-scoped Fly access in Actions secrets."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - name: Run maintenance inside Fly
        shell: bash
        run: |
          args=("$OPERATION")
          if [ "$FULL" = "true" ]; then args+=(--full); fi
          python scripts/fly_maintenance.py "${args[@]}"
      - name: Job summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          echo "### Winefornia maintenance: $JOB_STATUS" >> "$GITHUB_STEP_SUMMARY"
          echo "Operation: $OPERATION. Service keys remain in Fly; see the operation log for verification." >> "$GITHUB_STEP_SUMMARY"
